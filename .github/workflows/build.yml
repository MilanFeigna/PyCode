name: Build PyCode

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow reportlab

      - name: Build executable
        run: |
          pyinstaller --noconsole --onefile --name "PyCode" `
            --icon="PyCode_Logo.ico" `
            --add-data "*.ttf;." `
            --add-data "*.ico;." `
            --add-data "*.png;." `
            PyCode.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyCode-unsigned
          path: dist/PyCode.exe
